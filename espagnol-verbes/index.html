<script>
"use strict";
/* =====================================================================
   À RENSEIGNER : adresse du projet et clé « publishable » de Supabase
   (Project Settings > API Keys). Jamais la clé « secret ».
   ===================================================================== */
const SUPABASE_URL = "https://stptmmbdqiideisuiaez.supabase.co";
const SUPABASE_KEY = "sb_publishable_YohnI0HNx9y9z4XlQ3zt0g_9K0ht-ca";
/* Facultatif : nom de votre page « Buy me a coffee » (laisser vide pour masquer le lien). */
const COFFEE_ID = "";

/* ===== Réglages ===== */
const N = 20;              // nombre de questions par quiz
const T = 10000;           // durée de chaque phase (ms)
const TOLERANCE = 2;       // lettres d'écart acceptées pour une « erreur minime »
const WMIN = 0.1, WMAX = 5;
const COEF = { saisie:{ok:0.4,minime:0.7,pure:1.6}, choix:{ok:0.85,ko:1.6} };
const LEGACY_N = 209;      // nombre de verbes de l'ancienne version (import de progression)
const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";
const K = { cache:"quizv2_cache", pending:"quizv2_pending", legacy:"quiz_espagnol_paraguay_progression", legacyDone:"quizv2_legacy_done", quiz:"quizv2_quiz", opts:"quizv2_opts" };
const QUIZZES = { fr_es:{ label:"Français → Espagnol" }, es_fr:{ label:"Espagnol → Français" } };
const MODES = [["mixte","Saisie puis choix"],["saisie","Saisie seule"],["choix","Choix seul"]];
const LEVELS = [["tous","Tous"],["facile","Facile"],["difficile","Difficile"]];

/* ===== Outils ===== */
const root = document.getElementById("q");
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = w => Math.min(WMAX, Math.max(WMIN, w));
const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, " ");
const strip = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
function lsGet(k){ try{ const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = new Uint8Array(16); crypto.getRandomValues(b); b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b).map(x => x.toString(16).padStart(2, "0")).join("");
  return h.slice(0,8)+"-"+h.slice(8,12)+"-"+h.slice(12,16)+"-"+h.slice(16,20)+"-"+h.slice(20);
}
function lev(a, b){
  const m = []; for (let i = 0; i <= a.length; i++) m[i] = [i];
  for (let j = 1; j <= b.length; j++) m[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    m[i][j] = Math.min(m[i-1][j]+1, m[i][j-1]+1, m[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m[a.length][b.length];
}
function grade(inp, accepted){
  const acc = accepted.map(norm), n = norm(inp);
  if (acc.indexOf(n) > -1) return "ok";
  if (acc.some(x => strip(x) === strip(n))) return "minime";
  const d = Math.min.apply(null, acc.map(x => lev(strip(x), strip(n))));
  return (d <= TOLERANCE && n.length >= 3) ? "minime" : "pure";
}
function shuffle(a){ a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pct(x){ return (x == null || isNaN(x)) ? "–" : (Math.round(x*1000)/10) + " %"; }
function frac(n, t){ return t ? n / t : null; }
function ago(ts){
  if (!ts) return "jamais";
  const m = Math.floor((Date.now() - ts) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return "il y a " + m + " min";
  const h = Math.floor(m / 60);
  if (h < 48) return "il y a " + h + " h";
  return "il y a " + Math.floor(h / 24) + " jours";
}
function isNetErr(e){ return !!e && (e.name === "AuthRetryableFetchError" || e.status === 0 || /fetch|network|load failed/i.test(e.message || "")); }

/* ===== État ===== */
const HASH_ERR = (() => { try{ const h = new URLSearchParams(location.hash.replace(/^#/, "")); return !!(h.get("error_description") || h.get("error")); }catch(e){ return false; } })();
const S = { user:null, role:"user", verbs:[], WQ:{ fr_es:{}, es_fr:{} }, W:{}, quiz:"fr_es", offline:false, pending:[], lastSync:0 };
function setQuiz(q){ S.quiz = q; S.W = S.WQ[q]; }
(() => {
  let q = null;
  try{ q = new URLSearchParams(location.search).get("quiz"); }catch(e){}
  if (q !== "fr_es" && q !== "es_fr") q = lsGet(K.quiz);
  if (q !== "fr_es" && q !== "es_fr") q = "fr_es";
  lsSet(K.quiz, q); S.quiz = q; S.W = S.WQ[q];
})();
const O = (() => { const o = lsGet(K.opts) || {}; return { mode:MODES.some(m => m[0] === o.mode) ? o.mode : "mixte", level:LEVELS.some(m => m[0] === o.level) ? o.level : "tous" }; })();
let sb = null, HASH_ERR_SHOWN = false;
const GO_REQ = location.hash === "#demandes";
if (window.supabase && SUPABASE_URL && SUPABASE_KEY){
  try{ sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } }); }catch(e){ sb = null; }
}
function saveCache(){ lsSet(K.cache, { user:S.user, role:S.role, verbs:S.verbs, WQ:S.WQ, lastSync:S.lastSync }); }
function savePending(){
  const others = (lsGet(K.pending) || []).filter(p => !S.user || p.uid !== S.user.id);
  lsSet(K.pending, others.concat(S.pending));
}
function useCache(c){
  S.user = c.user; S.role = c.role || "user"; S.verbs = c.verbs || []; S.WQ = { fr_es:(c.WQ && c.WQ.fr_es) || c.W || {}, es_fr:(c.WQ && c.WQ.es_fr) || {} }; setQuiz(S.quiz); S.lastSync = c.lastSync || 0;
  S.pending = (lsGet(K.pending) || []).filter(p => p.uid === S.user.id);
}

/* ===== Synchronisation ===== */
/* Les requêtes sont limitées dans le temps : hors ligne, la bibliothèque réessaie
   plusieurs secondes avant d'abandonner, ce qui laisserait un écran vide. */
function wt(p, ms){ return Promise.race([p, new Promise(res => setTimeout(() => res({ error:{ message:"timeout", name:"Timeout" } }), ms || 4000))]); }
/* Compteurs par verbe d'une partie : essais, échecs, mauvaises réponses (les plus récentes d'abord) */
function itemsOf(p){
  if (p.items) return p.items;
  const W = {}; (p.weights || []).forEach(w => { W[w.verb_id] = w.weight; });
  const by = {};
  (p.answers || []).slice().sort((a, b) => b.position - a.position).forEach(a => {
    const it = by[a.verb_id] || (by[a.verb_id] = { verb_id:a.verb_id, weight:W[a.verb_id] == null ? 1 : W[a.verb_id], attempts:0, fails:0, wrong:[] });
    it.attempts++;
    if (a.result === "pure" || a.result === "ko"){ it.fails++; if (a.given && String(a.given).trim()) it.wrong.push(String(a.given).trim()); }
  });
  return Object.keys(by).map(k => by[k]);
}
async function pushSession(p){
  try{
    const r = await wt(sb.rpc("record_session", { p_id:p.id, p_played_at:p.played_at, p_sum:p.sum, p_items:itemsOf(p), p_quiz:p.quiz || "fr_es", p_mode:p.mode || "mixte", p_level:p.level || "tous" }), 8000);
    return !r.error;
  }catch(e){ return false; }
}
async function flushPending(){
  if (!sb || !S.user) return;
  const rest = []; let stop = false;
  for (const p of S.pending){
    if (stop){ rest.push(p); continue; }
    const ok = await pushSession(p);
    if (!ok){ rest.push(p); stop = true; }
  }
  S.pending = rest; savePending();
}
async function loadAll(){
  const cache = lsGet(K.cache);
  const cacheW = (cache && cache.user && cache.user.id === S.user.id && (cache.WQ || (cache.W && { fr_es:cache.W }))) || null;
  S.pending = (lsGet(K.pending) || []).filter(p => p.uid === S.user.id);
  if (S.pending.length) await flushPending();
  let pr, vr, gr;
  try{
    [pr, vr, gr] = await Promise.all([
      wt(sb.from("profiles").select("role").eq("user_id", S.user.id).maybeSingle()),
      wt(sb.from("verbs").select("id,fr,es,difficulty").eq("active", true).order("id").range(0, 999)),
      wt(sb.from("progress").select("quiz,verb_id,weight").range(0, 1999))
    ]);
  }catch(e){ pr = vr = gr = { error:e }; }
  if (pr.error || vr.error || gr.error){
    S.offline = true;
    if (cache && cache.user && cache.user.id === S.user.id && cache.verbs){ useCache(cache); S.offline = true; }
    return false;
  }
  S.role = (pr.data && pr.data.role) || "user";
  S.verbs = vr.data || [];
  const server = { fr_es:{}, es_fr:{} }; (gr.data || []).forEach(r => { if (server[r.quiz]) server[r.quiz][r.verb_id] = r.weight; });
  const keep = S.pending.length && cacheW;
  S.WQ = { fr_es:keep ? Object.assign({}, server.fr_es, cacheW.fr_es || {}) : server.fr_es, es_fr:keep ? Object.assign({}, server.es_fr, cacheW.es_fr || {}) : server.es_fr };
  setQuiz(S.quiz);
  S.offline = false; S.lastSync = Date.now();
  saveCache();
  return true;
}
async function reloadVerbs(){
  const r = await sb.from("verbs").select("id,fr,es,difficulty").eq("active", true).order("id").range(0, 999);
  if (!r.error){ S.verbs = r.data || []; saveCache(); }
}

/* ===== Démarrage et connexion ===== */
function readHashError(){
  if (HASH_ERR){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }
  return HASH_ERR;
}
function screenMsg(title, html){ root.innerHTML = '<div class="center" style="padding:2rem 0"><h1>'+esc(title)+'</h1><div class="muted small">'+html+'</div></div>'; }
function screenSetup(){
  screenMsg("Configuration à terminer", "Renseignez <b>SUPABASE_URL</b> et <b>SUPABASE_KEY</b> (clé « publishable ») au début du script de ce fichier, puis rechargez la page.");
}
async function boot(){
  clearInterval(timer); fbOff();
  if (!SUPABASE_URL || !SUPABASE_KEY) return screenSetup();
  screenMsg("Chargement…", "");
  const cache = lsGet(K.cache);
  const cacheOK = cache && cache.user && cache.verbs && cache.verbs.length;
  if (!sb){
    if (cacheOK){ useCache(cache); S.offline = true; return home(); }
    return screenMsg("Connexion impossible", "Le service de connexion n'a pas pu être chargé. Vérifiez votre connexion internet puis rechargez la page.");
  }
  const hashErr = readHashError();
  HASH_ERR_SHOWN = hashErr;
  let session = null, netFail = false;
  try{
    const r = await sb.auth.getSession();
    session = (r.data && r.data.session) || null;
    if (!session && r.error) netFail = true;
  }catch(e){ netFail = true; }
  if (session){
    S.user = { id:session.user.id, email:session.user.email };
    await loadAll();
    if (GO_REQ && S.role === "admin" && !S.offline){ try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} return screenAdmin(); }
    return home();
  }
  if (netFail && cacheOK){ useCache(cache); S.offline = true; return home(); }
  S.user = null;
  screenLogin(hashErr && !session ? "Ce lien n'est plus valide (expiré ou déjà utilisé). Demandez-en un nouveau." : "");
}
let cooldownT = null;
const SOURCES = [["facebook","Facebook"],["reseau","Autre réseau social (Instagram, Reddit, TikTok, YouTube…)"],["recherche","Recherche sur internet"],["ami","Ami, famille (bouche à oreille)"],["cours","Cours ou professeur"],["groupe","Groupe ou forum"],["autre","Autre"]];

/* ===== Import d'une ancienne progression (V1 / V2) ===== */
function legacyDecode(s){
  s = String(s || "").replace(/\s+/g, "");
  const w = ch => WMIN * Math.pow(WMAX / WMIN, ch / 63);
  if (s.indexOf("V1-") === 0){
    if (s.length !== 3 + LEGACY_N) return null;
    const out = [];
    for (const c of s.slice(3)){ const v = B64.indexOf(c); if (v < 0) return null; out.push(w(v)); }
    return out;
  }
  if (s.indexOf("V2-") === 0){
    const r = s.slice(3), d = r.lastIndexOf(".");
    if (d < 0 || r.length - d !== 3) return null;
    const b = r.slice(0, d), L = []; let i = 0;
    while (i < b.length){
      const v = B64.indexOf(b[i]); if (v < 0) return null; i++;
      let n = 1;
      if (b[i] === "("){
        const e = b.indexOf(")", i); if (e < 0) return null;
        const num = b.slice(i + 1, e); if (!/^\d+$/.test(num)) return null;
        n = parseInt(num, 10); if (n < 1 || n > LEGACY_N) return null; i = e + 1;
      }
      for (let k = 0; k < n; k++) L.push(v);
      if (L.length > LEGACY_N) return null;
    }
    if (L.length !== LEGACY_N) return null;
    let sum = 0; L.forEach((v, j) => { sum += (v + 1) * (j + 1); }); sum %= 4096;
    if (B64[sum >> 6] + B64[sum & 63] !== r.slice(d + 1)) return null;
    return L.map(w);
  }
  return null;
}
function getLegacyLocal(){
  try{
    const raw = localStorage.getItem(K.legacy); if (!raw) return "";
    try{ const o = JSON.parse(raw); return typeof o === "string" ? o : ((o && o.c) || ""); }catch(e){ return raw; }
  }catch(e){ return ""; }
}
async function importLegacy(code){
  const arr = legacyDecode(code);
  if (!arr) return { ok:false, msg:"Code invalide ou incomplet : rien n'a été importé." };
  const known = {}; S.verbs.forEach(v => { known[v.id] = true; });
  const rows = [];
  arr.forEach((w, i) => { const id = i + 1; if (known[id] && Math.abs(w - 1) > 0.02) rows.push({ user_id:S.user.id, quiz:"fr_es", verb_id:id, weight:clamp(w), updated_at:new Date().toISOString() }); });
  if (!rows.length) return { ok:false, msg:"Ce code ne contient aucun poids à importer." };
  const r = await sb.from("progress").upsert(rows, { onConflict:"user_id,quiz,verb_id" });
  if (r.error) return { ok:false, msg:"Import impossible pour le moment (connexion ou projet en pause). Réessayez plus tard." };
  rows.forEach(x => { S.WQ.fr_es[x.verb_id] = x.weight; });
  lsSet(K.legacyDone, true); saveCache();
  return { ok:true, msg:rows.length + " verbes importés." };
}

/* ===== Quiz ===== */
let order, idx, R, timer, t0, cur, opts, QN = N, shown, ansList, fbH = null, fbT = 0, curMode, runOpts;
function drawWeighted(n, poolIdx){
  const pool = poolIdx.slice(), out = [];
  while (out.length < n && pool.length){
    let tot = 0; pool.forEach(i => { const w = S.W[S.verbs[i].id]; tot += (w == null ? 1 : w); });
    let r = Math.random() * tot, k = 0;
    for (; k < pool.length - 1; k++){ const w = S.W[S.verbs[pool[k]].id]; r -= (w == null ? 1 : w); if (r <= 0) break; }
    out.push(pool[k]); pool.splice(k, 1);
  }
  return out;
}
function start(){
  const pool = poolOf(O.level); if (pool.length < 4) return;
  runOpts = { quiz:S.quiz, mode:O.mode, level:O.level };
  QN = Math.min(N, pool.length); order = drawWeighted(QN, pool); idx = 0; R = []; next();
}
function fbOff(){ if (fbH){ document.removeEventListener("keydown", fbH); fbH = null; } }
function head(withTimer){
  return '<div class="top"><span>Question '+(idx+1)+' / '+QN+'</span>'+(withTimer ? '<span id="tl">'+(T/1000)+' s</span>' : '<span>'+(curMode === "saisie" ? "Saisie" : "Choix")+'</span>')+'</div>'+
         '<div class="bar-wrap"><div class="bar" id="bar"'+(withTimer ? '' : ' style="width:0"')+'></div></div><p class="verb">'+esc(shown)+'</p>';
}
function tick(cb){
  clearInterval(timer); t0 = Date.now();
  timer = setInterval(() => {
    const r = Math.max(0, T - (Date.now() - t0));
    const bar = $("bar"), tl = $("tl"); if (!bar || !tl){ clearInterval(timer); return; }
    bar.style.width = (r / T * 100) + "%"; tl.textContent = Math.ceil(r / 1000) + " s";
    if (r <= 0){ clearInterval(timer); cb(); }
  }, 100);
}
/* Question : mot affiché, réponses acceptées */
function prepare(){
  cur = S.verbs[order[idx]];
  if (runOpts.quiz === "es_fr"){
    shown = cur.es[Math.floor(Math.random() * cur.es.length)];
    const k = norm(shown);
    const acc = S.verbs.filter(v => v.es.some(x => norm(x) === k)).map(v => v.fr);
    ansList = [cur.fr].concat(acc.filter(x => x !== cur.fr));
  } else { shown = cur.fr; ansList = cur.es.slice(); }
}
function rec(mode, res, given){
  R.push({ verb_id:cur.id, position:idx + 1, mode:mode, result:res, given:given || null, shown:shown, ans:ansList[0], all:ansList });
  feedback();
}
function next(){
  fbOff();
  if (idx >= QN) return end();
  prepare();
  if (runOpts.mode === "choix") return choices();
  curMode = "saisie";
  root.innerHTML = head(true)+'<div class="row"><input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(runOpts.quiz === "es_fr" ? "Verbe en français" : "Verbe en espagnol")+'" style="width:260px"><button class="primary" id="ok">Valider</button></div><p id="er" class="msg bad center"></p>';
  const inp = $("in"); inp.focus();
  inp.oninput = () => { $("er").textContent = ""; };
  const sub = () => {
    if (!norm(inp.value)){ $("er").textContent = "Écrivez un verbe, ou attendez la fin du temps."; return; }
    clearInterval(timer); rec("saisie", grade(inp.value, ansList), inp.value.trim());
  };
  $("ok").onclick = sub;
  inp.onkeydown = e => { if (e.key === "Enter" && !e.repeat) sub(); };
  tick(() => {
    if (norm(inp.value)) rec("saisie", grade(inp.value, ansList), inp.value.trim());
    else if (runOpts.mode === "saisie") rec("saisie", "pure", "");
    else choices();
  });
}
function choices(){
  curMode = "choix";
  const seen = {}, d = [], accN = ansList.map(norm);
  const label = v => runOpts.quiz === "es_fr" ? v.fr : v.es[0];
  shuffle(S.verbs.filter(v => v !== cur)).forEach(v => {
    const t = label(v), key = norm(t);
    if (d.length < 3 && !seen[key] && accN.indexOf(key) < 0){ seen[key] = true; d.push(t); }
  });
  opts = shuffle([ansList[0]].concat(d));
  root.innerHTML = head(true)+'<p class="center muted small" style="margin:0 0 12px">Choisissez la bonne réponse</p><div class="choices">'+opts.map((o, i) => '<button data-i="'+i+'">'+esc(o)+'</button>').join("")+'</div>';
  root.querySelectorAll("button[data-i]").forEach(b => { b.onclick = () => { clearInterval(timer); const o = opts[+b.dataset.i]; rec("choix", accN.indexOf(norm(o)) > -1 ? "ok" : "ko", o); }; });
  tick(() => rec("choix", "ko", ""));
}
/* Retour après chaque réponse */
function feedback(){
  clearInterval(timer);
  const x = R[R.length - 1], good = '<b class="good">'+esc(x.all.join(" / "))+'</b>';
  let h = head(false), fb;
  if (x.mode === "saisie"){
    h += '<span class="inp '+(x.result === "ok" ? "ok" : "ko")+'">'+(x.given ? esc(x.given) : "(aucune réponse)")+'</span>';
    if (x.result === "ok") fb = ['ok', '<b class="good">Correct.</b>'+(x.all.length > 1 ? ' Également accepté : '+esc(x.all.filter(a => norm(a) !== norm(x.given)).join(" / ")) : "")];
    else if (!x.given) fb = ['ko', '<b class="bad">Temps écoulé.</b> Bonne réponse : '+good];
    else fb = ['ko', '<b class="bad">'+(x.result === "minime" ? "Erreur minime." : "Erreur complète.")+'</b> Bonne réponse : '+good];
  } else {
    const accN = x.all.map(norm);
    h += '<div class="choices">'+opts.map(o => { const c = accN.indexOf(norm(o)) > -1 ? "ok" : (o === x.given ? "ko" : ""); return '<button disabled class="'+c+'">'+esc(o)+'</button>'; }).join("")+'</div>';
    fb = x.result === "ok" ? ['ok', '<b class="good">Correct.</b>'] : ['ko', '<b class="bad">'+(x.given ? "Incorrect." : "Temps écoulé.")+'</b> Bonne réponse : '+good];
  }
  h += '<div class="fb '+fb[0]+'">'+fb[1]+'</div><div class="next"><button class="primary" id="nx">'+(idx + 1 >= QN ? "Voir le bilan →" : "Question suivante →")+'</button></div>';
  root.innerHTML = h;
  fbT = Date.now();
  const go = () => { if (!fbH || Date.now() - fbT < 250) return; fbOff(); idx++; next(); };
  $("nx").onclick = go;
  fbH = e => { if (e.key === "Enter"){ e.preventDefault(); if (!e.repeat) go(); } };
  document.addEventListener("keydown", fbH);
}

/* ===== Bilan ===== */
function band(p){ return p == null ? "" : (p < 0.25 ? "b1" : p < 0.5 ? "b2" : p <= 0.75 ? "b3" : "b4"); }
function ln(l, n, t){ return '<div class="ln"><span>'+l+'</span><span>'+n+' · '+pct(frac(n, t))+'</span></div>'; }
function col(title, n, okN, lines){
  return '<div class="col"><div class="hd"><span>'+title+'</span><span class="muted">'+n+' question'+(n > 1 ? "s" : "")+'</span></div>'+
    '<div class="big '+band(frac(okN, n))+'"><div class="v">'+pct(frac(okN, n))+'</div><div class="l">'+okN+' correcte'+(okN > 1 ? "s" : "")+' sur '+n+'</div></div>'+lines+'</div>';
}
async function end(){
  clearInterval(timer); fbOff();
  const Sa = R.filter(x => x.mode === "saisie"), Ch = R.filter(x => x.mode === "choix");
  const c = (a, r) => a.filter(x => x.result === r).length;
  const sum = { n_total:QN, n_saisie:Sa.length, n_choix:Ch.length, s_ok:c(Sa,"ok"), s_minime:c(Sa,"minime"), s_pure:c(Sa,"pure"), c_ok:c(Ch,"ok"), c_ko:c(Ch,"ko") };
  const WQ = S.WQ[runOpts.quiz], changed = {};
  R.forEach(x => { const cw = WQ[x.verb_id] == null ? 1 : WQ[x.verb_id]; const nw = clamp(cw * COEF[x.mode][x.result]); WQ[x.verb_id] = nw; changed[x.verb_id] = nw; });
  const payload = {
    id:uuid(), uid:S.user.id, played_at:new Date().toISOString(), sum:sum, quiz:runOpts.quiz, mode:runOpts.mode, level:runOpts.level,
    answers:R.map(x => ({ position:x.position, verb_id:x.verb_id, mode:x.mode, result:x.result, given:x.given })),
    weights:Object.keys(changed).map(k => ({ verb_id:+k, weight:changed[k] }))
  };

  S.pending.push(payload); savePending(); saveCache();

}
function renderBilan(sum){

function dl(a, b){ if (a == null || b == null) return ""; const d = Math.round((a - b) * 100); return ' <span class="'+(d >= 0 ? "good" : "bad")+'">('+(d >= 0 ? "+" : "")+d+')</span>'; }

/* ===== Statistiques ===== */
const tzName = () => { try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; }catch(e){ return "UTC"; } };
function dkey(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function axisDays(n){ const t = new Date(), out = []; for (let i = n - 1; i >= 0; i--) out.push(dkey(new Date(t.getFullYear(), t.getMonth(), t.getDate() - i))); return out; }
const CH = { W:640, pl:36, pr:12, pt:10 };
function axisLabels(ax, Ht){
  const f = k => k.slice(8)+"/"+k.slice(5, 7), n = ax.length, step = (CH.W - CH.pl - CH.pr) / n;
  const pos = i => CH.pl + (i + 0.5) * step; let g = "";
  const picks = n <= 8 ? ax.map((k, i) => i) : [0, Math.round((n - 1) / 3), Math.round(2 * (n - 1) / 3), n - 1];
  picks.forEach(i => { g += '<text x="'+pos(i).toFixed(1)+'" y="'+(Ht - 6)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">'+f(ax[i])+'</text>'; });
  return g;
}
function chartLines(ax, series, label){
  const Ht = 190, pb = 26, n = ax.length, step = (CH.W - CH.pl - CH.pr) / n;
  const x = i => CH.pl + (i + 0.5) * step, y = v => CH.pt + (1 - v) * (Ht - CH.pt - pb);
  let g = "";
  [0, .25, .5, .75, 1].forEach(t => { g += '<line x1="'+CH.pl+'" x2="'+(CH.W-CH.pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" style="stroke:var(--border)" stroke-width="1"/><text x="'+(CH.pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+Math.round(t*100)+'</text>'; });
  let any = false;
  series.forEach(se => {
    const pts = []; ax.forEach((k, i) => { const v = se.vals[k]; if (v != null) pts.push([x(i), y(v)]); });
    if (!pts.length) return; any = true;
    if (pts.length > 1) g += '<polyline fill="none" style="stroke:'+se.c+'" stroke-width="2" points="'+pts.map(p => p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")+'"/>';
    pts.forEach(p => { g += '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" style="fill:'+se.c+'"/>'; });
  });
  if (!any) return '<p class="muted small">Aucun quiz sur cette période.</p>';
  return '<svg viewBox="0 0 '+CH.W+' '+Ht+'" style="width:100%;height:auto" role="img" aria-label="'+esc(label)+'">'+g+axisLabels(ax, Ht)+'</svg>'+
    '<div class="legend">'+series.map(s => '<span><i style="background:'+s.c+'"></i>'+s.name+'</span>').join("")+'</div>';
}
function chartBars(ax, vals, label){
  const Ht = 120, pb = 26, n = ax.length, step = (CH.W - CH.pl - CH.pr) / n;
  const max = Math.max(1, ...ax.map(k => vals[k] || 0)), top = max <= 4 ? max : Math.ceil(max / 2) * 2;
  const y = v => CH.pt + (1 - v / top) * (Ht - CH.pt - pb);
  let g = '';
  [0, top].forEach(t => { g += '<line x1="'+CH.pl+'" x2="'+(CH.W-CH.pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" style="stroke:var(--border)" stroke-width="1"/><text x="'+(CH.pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+t+'</text>'; });
  const bw = Math.max(2, Math.min(24, step * 0.6));
  ax.forEach((k, i) => { const v = vals[k] || 0; if (v) g += '<rect x="'+(CH.pl + (i + 0.5) * step - bw / 2).toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(y(0) - y(v)).toFixed(1)+'" rx="2" style="fill:var(--accent)"/>'; });
  return '<svg viewBox="0 0 '+CH.W+' '+Ht+'" style="width:100%;height:auto" role="img" aria-label="'+esc(label)+'">'+g+axisLabels(ax, Ht)+'</svg>';
}
function verbOf(id){ return S.verbs.find(x => x.id === id); }
function vLabel(id, fr, quiz){

      row.querySelectorAll("button").forEach(x => x.disabled = true);
      if (b.dataset.r === "r"){
        const r = await sb.from("access_requests").update({ status:"rejected", decided_at:new Date().toISOString() }).eq("id", id);
        if (r.error){ admMsg("Rejet impossible.", false); row.querySelectorAll("button").forEach(x => x.disabled = false); return; }
        AR = AR.filter(x => x.id !== id); bindReqRows(); admMsg("Demande rejetée.", true); return;
      }
      let r;
      try{ r = await sb.functions.invoke("approve-request", { body:{ id:id } }); }catch(e){ r = { error:e }; }
      if (r.error || (r.data && r.data.error)){ admMsg("Approbation impossible : " + ((r.data && r.data.error) || "la fonction d'invitation n'a pas répondu."), false); row.querySelectorAll("button").forEach(x => x.disabled = false); return; }
      AR = AR.filter(x => x.id !== id); bindReqRows(); admMsg("Demande approuvée : une invitation a été envoyée à " + (q ? q.email : "l'adresse") + ".", true);
    };
  });
}
async function screenAdmin(){
  if (S.role !== "admin") return home();
  root.innerHTML = '<p class="muted small center">Chargement…</p>';
  const [vr, ur, rq] = await Promise.all([
    sb.from("verbs").select("id,fr,es,active,difficulty").order("id").range(0, 999),
    sb.from("profiles").select("email,role,created_at").order("created_at"),
    sb.from("access_requests").select("id,email,source,source_detail,in_paraguay,created_at").eq("status", "pending").order("created_at")
  ]);
  AR = rq.error ? [] : (rq.data || []);
  if (vr.error){ root.innerHTML = '<p><button class="small" id="bk">← Accueil</button></p><p class="center bad small">Administration indisponible pour le moment.</p>'; $("bk").onclick = home; return; }
  AV = vr.data || [];
  let h = '<p><button class="small" id="bk">← Accueil</button></p><h1>Administration</h1><div id="am" class="msg"></div>';
  h += '<h2>Demandes d\'accès</h2><div id="rq"></div>';
  h += '<h2>Ajouter un verbe</h2><div class="row" style="justify-content:flex-start"><input type="text" id="nf" placeholder="Français (ex. conduire)" style="flex:1;min-width:150px"><input type="text" id="ne" placeholder="Espagnol (variantes séparées par /)" style="flex:1;min-width:150px"><select id="nd" aria-label="Niveau"><option value="1">Facile</option><option value="2">Difficile</option></select><button class="primary small" id="na">Ajouter</button></div>';
  h += '<h2>Importer en lot</h2><textarea id="imp" rows="4" placeholder="Une ligne par verbe : français|espagnol1/espagnol2|niveau (facile ou difficile, facultatif)"></textarea><p style="margin:6px 0 0"><button class="small" id="imb">Importer</button> <span class="muted small">Les verbes déjà présents (même texte français) sont ignorés.</span></p>';
  h += '<h2>Verbes ('+AV.length+')</h2><input type="text" id="fl" placeholder="Rechercher…" style="width:100%;margin-bottom:6px"><div id="vl"></div>';
  h += '<h2>Utilisateurs</h2>';
  if (ur.error) h += '<p class="muted small">Liste indisponible.</p>';
  else {
    h += '<div style="border-top:1px solid var(--border)">'+(ur.data || []).map(u => '<div class="vrow"><span class="t">'+esc(u.email)+'</span><span class="muted small">'+esc(u.role === "admin" ? "administrateur" : "utilisateur")+'</span></div>').join("")+'</div>';
    h += '<p class="muted small">Les nouveaux utilisateurs arrivent par les demandes d\'accès ci-dessus. Invitation manuelle possible : tableau de bord Supabase, Authentication, Users.</p>';
  }
  root.innerHTML = h;
  bindReqRows();
  $("bk").onclick = home;
  $("na").onclick = adminAdd;
  $("imb").onclick = adminImport;
  $("fl").oninput = renderVerbList;
  renderVerbList();
}
function renderVerbList(){
  const q = norm($("fl").value || "");
  const list = AV.filter(v => !q || norm(v.fr).indexOf(q) > -1 || v.es.some(x => norm(x).indexOf(q) > -1));
  $("vl").innerHTML = '<div style="border-top:1px solid var(--border)">'+list.map(v =>
    '<div class="vrow'+(v.active ? '' : ' off')+'" data-id="'+v.id+'"><span class="id">'+v.id+'</span><span class="t"><b>'+esc(v.fr)+'</b> → '+esc(v.es.join(" / "))+' <span class="muted small">· '+(v.difficulty === 2 ? "difficile" : "facile")+'</span>'+(v.active ? '' : ' <span class="muted small">(désactivé)</span>')+'</span>'+
    '<span><button class="small" data-a="e">Modifier</button> <button class="small" data-a="t">'+(v.active ? "Désactiver" : "Activer")+'</button></span></div>').join("")+'</div>';
  $("vl").querySelectorAll("button[data-a]").forEach(b => {
    b.onclick = () => { const id = +b.closest(".vrow").dataset.id; if (b.dataset.a === "e") editRow(id); else toggleVerb(id); };
  });
}
function editRow(id){
  const v = AV.find(x => x.id === id), row = $("vl").querySelector('.vrow[data-id="'+id+'"]');
  row.innerHTML = '<span class="id">'+id+'</span><span class="t" style="display:flex;gap:6px;flex-wrap:wrap"><input type="text" id="ef" value="'+esc(v.fr)+'" style="flex:1;min-width:120px"><input type="text" id="ee" value="'+esc(v.es.join(" / "))+'" style="flex:2;min-width:160px"><select id="ed" aria-label="Niveau"><option value="1"'+(v.difficulty === 2 ? '' : ' selected')+'>Facile</option><option value="2"'+(v.difficulty === 2 ? ' selected' : '')+'>Difficile</option></select></span><span><button class="small primary" id="es">Enregistrer</button> <button class="small" id="ec">Annuler</button></span>';
  $("ec").onclick = renderVerbList;
  $("es").onclick = async () => {
    const fr = $("ef").value.trim(), es = parseEs($("ee").value);
    if (!fr || !es.length){ admMsg("Renseignez le français et au moins une traduction.", false); return; }
    const df = +$("ed").value === 2 ? 2 : 1;
    const r = await sb.from("verbs").update({ fr:fr, es:es, difficulty:df }).eq("id", id);
    if (r.error){ admMsg("Modification impossible.", false); return; }
    v.fr = fr; v.es = es; v.difficulty = df; await reloadVerbs(); renderVerbList(); admMsg("Verbe modifié.", true);
  };
}
async function toggleVerb(id){
  const v = AV.find(x => x.id === id);
  const r = await sb.from("verbs").update({ active:!v.active }).eq("id", id);
  if (r.error){ admMsg("Modification impossible.", false); return; }
  v.active = !v.active; await reloadVerbs(); renderVerbList(); admMsg(v.active ? "Verbe activé." : "Verbe désactivé.", true);
}
async function adminAdd(){
  const fr = $("nf").value.trim(), es = parseEs($("ne").value);
  if (!fr || !es.length){ admMsg("Renseignez le français et au moins une traduction.", false); return; }
  if (AV.some(v => norm(v.fr) === norm(fr))){ admMsg("Ce verbe existe déjà.", false); return; }
  const id = AV.reduce((m, v) => Math.max(m, v.id), 0) + 1;
  const df = +$("nd").value === 2 ? 2 : 1;
  const r = await sb.from("verbs").insert([{ id:id, fr:fr, es:es, difficulty:df }]);
  if (r.error){ admMsg("Ajout impossible.", false); return; }
  AV.push({ id:id, fr:fr, es:es, active:true, difficulty:df }); await reloadVerbs();
  $("nf").value = ""; $("ne").value = ""; renderVerbList(); admMsg("Verbe ajouté.", true);
}
async function adminImport(){
  const lines = $("imp").value.split(/[\n;]+/).map(s => s.trim()).filter(Boolean);
  const known = {}; AV.forEach(v => { known[norm(v.fr)] = true; });
  let id = AV.reduce((m, v) => Math.max(m, v.id), 0), skipped = 0, bad = 0; const rows = [];
  lines.forEach(l => {
    const p = l.split("|"); const fr = (p[0] || "").trim(), es = parseEs(p[1]);
    if (!fr || !es.length){ bad++; return; }
    if (known[norm(fr)]){ skipped++; return; }
    const lv = norm(p[2] || ""), df = (lv === "2" || lv === "difficile") ? 2 : 1;
    known[norm(fr)] = true; id++; rows.push({ id:id, fr:fr, es:es, difficulty:df });
  });
  if (!rows.length){ admMsg("Rien à importer ("+skipped+" déjà présents, "+bad+" lignes invalides).", false); return; }
  const r = await sb.from("verbs").insert(rows);
  if (r.error){ admMsg("Import impossible.", false); return; }
  rows.forEach(x => AV.push({ id:x.id, fr:x.fr, es:x.es, active:true, difficulty:x.difficulty }));
  await reloadVerbs(); $("imp").value = ""; renderVerbList();
  admMsg(rows.length+" verbes importés, "+skipped+" ignorés, "+bad+" lignes invalides.", true);
}

/* ===== Lancement ===== */
if (COFFEE_ID && /^[A-Za-z0-9_.-]+$/.test(COFFEE_ID)){
  const c = $("coffee"); if (c) c.innerHTML = ' · <a href="https://buymeacoffee.com/'+COFFEE_ID+'" target="_blank" rel="noopener noreferrer">☕ Offrir un café</a>';
}
try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
boot();
