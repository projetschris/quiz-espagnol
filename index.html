<style>
:root{--bg:#f5f5f2;--card:#ffffff;--text:#1f1f1c;--muted:#6b6b66;--border:#dcdcd5;--accent:#2f6fdb;--tint:#e2ecfb;--tintb:#b9cdf0}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#242427;--text:#ececea;--muted:#9a9a94;--border:#3a3a3f;--accent:#6aa0ff;--tint:#1d2d4a;--tintb:#2f4a78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:26px;font-weight:700;margin:0 0 4px;text-align:center}
.sub{font-size:12px;color:var(--muted);text-align:center;margin:0 0 26px}
h2{font-size:19px;font-weight:600;margin:0 0 2px}
h3{font-size:15px;font-weight:500;color:var(--muted);margin:0 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quiz{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 10px;text-decoration:none;color:inherit}
.quiz:hover,.quiz:focus-visible{border-color:var(--accent)}
.quiz svg{width:44px;height:30px;flex:none;border-radius:3px;border:1px solid var(--border)}
.quiz .ar{font-size:22px;color:var(--muted)}
.soon{border:1px dashed var(--border);border-radius:14px;padding:12px;text-align:center;font-size:13px;color:var(--muted);margin:22px 0 0}
.love{background:var(--tint);border:1px solid var(--tintb);border-radius:12px;padding:14px;margin:22px 0 0;text-align:center}
.love b{display:block;margin-bottom:10px;font-size:14px}
.love .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.love button{font:inherit;font-size:14px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer}
.love button svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px}
.love a.bmc img{display:block;height:40px;width:auto;border-radius:6px}
.love .sh{font-size:12px;color:var(--muted);margin:8px 0 0;min-height:16px}
.foot{margin:24px 0 0;text-align:center;font-size:12px;color:var(--muted)}
</style>
</head>

<script>
/* Facultatif : nom de votre page « Buy me a coffee » (laisser vide pour masquer le bouton). */
const COFFEE_ID = "projetschris";
const SHARE_TEXT = "Tu veux apprendre facilement à communiquer en espagnol ? Essaie ça, c'est parfait !";
if (!COFFEE_ID || !/^[A-Za-z0-9_.-]+$/.test(COFFEE_ID)) document.getElementById("bmc").remove();
else document.getElementById("bmc").href = "https://buymeacoffee.com/" + COFFEE_ID;
document.getElementById("share").onclick = async function () {
  const out = document.getElementById("sh"), url = location.href.split("#")[0].split("?")[0];

};
