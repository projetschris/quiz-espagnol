<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2030%2020'%3E%3Crect%20width='30'%20height='7'%20fill='%23D52B1E'/%3E%3Crect%20y='7'%20width='30'%20height='6'%20fill='%23FFFFFF'/%3E%3Crect%20y='13'%20width='30'%20height='7'%20fill='%230038A8'/%3E%3Ccircle%20cx='15'%20cy='10'%20r='3.2'%20fill='none'%20stroke='%232E7D32'%20stroke-width='1'/%3E%3Ccircle%20cx='15'%20cy='10'%20r='1'%20fill='%23F2C200'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f2;--card:#ffffff;--text:#1f1f1c;--muted:#6b6b66;--border:#dcdcd5;--accent:#2f6fdb}
@media (prefers-color-scheme:dark){:root{--bg:#18181a;--card:#242427;--text:#ececea;--muted:#9a9a94;--border:#3a3a3f;--accent:#6aa0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
p.sub{color:var(--muted);font-size:14px;margin:0 0 24px}
.quiz{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin:0 0 12px;text-decoration:none;color:inherit}
.quiz:hover{border-color:var(--accent)}
.quiz svg{width:44px;height:30px;flex:none;border-radius:4px;border:1px solid var(--border)}
.quiz b{display:block;font-size:17px;font-weight:600}
.quiz span{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Mes quiz</h1>
<p class="sub">Choisissez un quiz.</p>
<a class="quiz" href="espagnol-verbes/">
<svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="7" fill="#D52B1E"/><rect y="7" width="30" height="6" fill="#FFFFFF"/><rect y="13" width="30" height="7" fill="#0038A8"/><circle cx="15" cy="10" r="3.2" fill="none" stroke="#2E7D32" stroke-width="1"/><circle cx="15" cy="10" r="1" fill="#F2C200"/></svg>
<div><b>Verbes espagnol (Paraguay)</b><span>30 questions · infinitifs · progression enregistrée</span></div>
</a>
</main>
</body>
</html>
